name: Bootstrap RenTR import

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-import.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-complete]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/rentr.tar.xz.b64
          base64 -d /tmp/rentr.tar.xz.b64 > /tmp/rentr.tar.xz
          tar -xJf /tmp/rentr.tar.xz -C .
          rm -rf .bootstrap
          # GITHUB_TOKEN cannot create/update workflow files via git push.
          # Keep this bootstrap workflow unchanged and import ci.yml separately later.
          rm -f .github/workflows/ci.yml
      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import RenTR project [bootstrap-complete]"
          git push
